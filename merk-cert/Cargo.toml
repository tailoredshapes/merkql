[package]
name = "merk-cert"
version = "0.1.0"
edition = "2024"
description = "Certification suite defining the merkql surface — an implementation that compiles against and passes this suite is a drop-in merkql"
license = "MIT"
repository = "https://github.com/tailoredshapes/merkql"

# The suite is a macro that expands inside the crate being certified, so this
# crate has no dependencies of its own. The certifying crate needs `chrono` as a
# dev-dependency (the format tests build a fixed-timestamp record).

[dev-dependencies]
merkql = { path = ".." }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
